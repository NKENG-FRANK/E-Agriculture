services:
  analytics-service:
    build: ./analytics_service
    ports:
      - "8000:8000"
    env_file:
      - ./analytics_service/.env
    restart: always

  user-management-service:
    build: ./user_mannagement_service
    ports:
      - "8001:8001"
    env_file:
      - ./user_mannagement_service/.env
    restart: always

  ai-insights-service:
    build: ./ai_insights_service
    ports:
      - "8002:8002"
    env_file:
      - ./ai_insights_service/.env
    restart: always
