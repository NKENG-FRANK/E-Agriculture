[build]
  command = "npm install && npm run build"
  publish = "dist"

# Single Page Application (SPA) redirect rule
# This ensures that TanStack Router paths work correctly on page refresh
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--version"
